# The base research dataset (Sprint 3: `xq dataset build experiments/configs/ds_base.yaml`).
#
# One row per complete 15-minute mid bar; decision time = the bar's available_at. Context bars
# (1h, 4h, 1d) are joined on availability; targets are forward returns filled on the correct side
# of the quote after the execution latency. The builder pins the bar build, the quality run and a
# config digest when it resolves this spec, and stores the resolved spec with the dataset.
#
# The source is the primary research feed, Dukascopy ticks in UTC (ADR 0057). The window is about
# four years before the vault, as the plan asks; Dukascopy's history (from 2003-05-05) no longer
# limits it, so a longer window is the owner's decision (docs/STATUS.md), taken before results.
# `end` equals vault.start: research datasets never reach into the vault.
name: ds_base
source: dukascopy
instrument: xauusd
base_timeframe: 15m
price_basis: mid
start: "2021-09-26T21:00:00Z"   # start of trading day 2021-09-27
end: "2025-09-25T21:00:00Z"     # vault.start
warmup: 10D
context_timeframes: [1h, 4h, 1d]
feature_set: {name: base, version: v1}
target_set: {name: fwd_returns, version: v1}   # execution-aware forward returns (TGT-002)
exclusions: []
