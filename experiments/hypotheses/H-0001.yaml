# DRAFT — NOT REGISTERED (revised at the start of Sprint 5, ADR 0035; readings approved, ADR 0041).
# `xq exp register` locks this exact text; register it only once the windows below are set from
# the real data's depth (the owner's step, C-15). Until then the two window fields are
# deliberately not timestamps, so registration is refused. The board runner implements the
# revision (ADR 0061): rules on 1d and 1h signal bars named <name>@<timeframe>, evaluated over the
# full pre-vault history after their own warm-up, with the fold-aligned view stored, and the
# descriptive slices below. The plan records the first baseline board as H-0001. ds_base runs from
# 2015-01-01 to vault.start (2025-09-25T21:00:00Z), fixed by the owner before any result (ADR 0062,
# C-26 (6)); its data is downloaded from 2014-01-01. A rule's warm-up still counts on the dataset's
# own signal bars (ADR 0061; whether it may use the 2014 bars is C-29).
id: H-0001
title: Do simple strategies make money after costs? (the baseline board)
family: baselines
statement: >
  At least one fixed-parameter baseline on the baseline board (experiments/configs/baselines/
  board.yaml: buy-and-hold, time-series momentum, z-score reversion, MA crossovers, Donchian
  breakout and their volatility-targeted versions, each on 1d and on 1h signal bars; and the sign
  of the forecast baselines) earns a positive net Sharpe ratio on its evaluation period that is
  significant (one-sided stationary-bootstrap p < 0.05) and survives deflation for every
  configuration evaluated in this family. A rule baseline's evaluation period is the full
  pre-vault history of ds_base (from 2015-01-01 to vault.start) after its own warm-up (its
  parameters are fixed in advance, so it needs no training window); a forecast-sign baseline's is
  the stitched walk-forward test folds.
rationale: >
  Trend-following and carry-like effects have been reported in gold and other futures, so simple
  rules might earn something after costs. They might not: retail XAUUSD costs (spread, slippage
  around the rollover and releases, financing on both sides) are large relative to daily moves,
  published effects decay, and the out-of-sample history is short. Rules with fixed parameters
  learn nothing from the data, so every pre-vault day after their warm-up is out of sample for
  them, which gives the longest honest record; their fold-aligned version (the same returns on the
  walk-forward test folds only) is stored too, so later candidates can be compared with them on
  identical days. Whatever the answer, the board is the benchmark every later candidate must beat.
target: fwd_ret_mid_1h           # forecast baselines also run on fwd_ret_mid_15m, _4h and _1d
information_set:
  - base.v1 decision-bar columns and the 1h, 4h and 1d context bars joined on availability
  - calendar and session columns known in advance (DS-007)
horizon: >
  15m, 1h, 4h, 1d (forecast baselines); rule baselines hold until their own signal changes
# Decision grid of ds_base: fills, costs and the forecast baselines. Rule signals are computed on
# 1d and 1h bars only (never on 15m bars); lookbacks count bars of the signal timeframe.
timeframe: 15m
discovery_window: set from the real data's depth at registration
evaluation_window: set from the real data's depth at registration
primary_metric: >
  net Sharpe ratio of daily returns after the provisional cost model (screening, placeholder
  costs), annualized with 252 periods: over the full pre-vault history after warm-up for a rule
  baseline, over the stitched walk-forward test folds for a forecast-sign baseline
success_criteria:
  - >
    A baseline has net Sharpe > 0 with one-sided bootstrap p < 0.05 (config/gates.yaml R1
    conventions: 10,000 resamples, Politis-White block length of at least 5 days) and a deflated
    Sharpe ratio >= 0.95 with the family's effective trial count
falsification_criteria:
  - >
    No baseline has a one-sided bootstrap p < 0.05 for net Sharpe > 0, or none keeps a deflated
    Sharpe ratio >= 0.95; either way the result stands as the negative benchmark
# 24 rule strategies (6 rules x plain and volatility-targeted x 1d and 1h signal bars) + 12
# forecast-sign strategies (4 targets x random_walk, historical_mean, climatology), one board run.
# A rule's fold-aligned version restricts the same configuration's returns to the test folds; it
# is stored for comparison and is not a further trial.
trial_budget: 36
planned_tests:
  - Stationary-bootstrap Sharpe interval and one-sided p-value (gate conventions)
  - Deflated Sharpe ratio with the effective and raw trial counts
  - Random-entry null per strategy (1,000 seeds, matched trade count and holding times)
  - Diebold-Mariano of every regression forecast baseline against zero_return
slices:                          # descriptive only: reported, not tested (no p-values, no trials)
  - year
  - session
