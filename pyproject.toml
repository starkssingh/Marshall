[project]
name = "xq"
version = "0.1.0"
description = "XAUUSD quantitative research platform: leakage-safe data, walk-forward evaluation and gated validation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Shubhang" }]
dependencies = [
    "alembic>=1.20.0",
    "holidays>=0.105",
    "numpy>=2.0,<2.5", # pandas 2.x emits deprecation errors under numpy 2.5
    "pandas>=2.2,<3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "tzdata>=2026.4",
]

[project.scripts]
xq = "xq.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xq"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pandas-stubs>=2.2,<3",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/specs/development-plan.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",      # misc lints
    "PT",       # pytest style
    "DTZ",      # naive datetimes are bugs here (convention 1)
    "NPY",      # numpy
    "RUF",      # ruff-specific
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: fast, isolated tests (auto-applied under tests/unit)",
    "integration: tests crossing module or I/O boundaries (auto-applied under tests/integration)",
    "property: hypothesis property-based tests (auto-applied under tests/property)",
    "leakage: look-ahead and availability tests (auto-applied under tests/leakage)",
    "slow: tests taking more than a few seconds; excluded from the default CI run",
    "research: tests that need real market data; never run in CI",
]

[tool.coverage.run]
source = ["xq"]
branch = true
