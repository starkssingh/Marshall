[project]
name = "xq"
version = "0.1.0"
description = "XAUUSD quantitative research platform: leakage-safe data, walk-forward evaluation and gated validation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Shubhang" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xq"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
