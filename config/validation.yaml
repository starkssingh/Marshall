# Validation and robustness procedures (Phases 16 and 17: VAL-003 ... VAL-006, ROB-001 ... ROB-008;
# ADR 0054, ADR 0055). Every value is fixed before any candidate result exists; changing one needs
# an ADR. The pass/fail thresholds are not here: they are in config/gates.yaml, and the bootstrap
# convention (n_boot, Politis-White block, at least 5 days) is the gates' own.

spa_size_check:          # C-24 (1): does SPA / the Reality Check over-reject on this sample?
  n_sim: 500             # null families simulated with the sample's serial dependence
  n_boot: 199            # bootstrap resamples per simulated family
  max_ar_order: 5        # AR sieve per strategy, order by AIC (Yule-Walker, always stationary)
  warn_ratio: 1.5        # warn when the simulated size exceeds 1.5x the gate's level (owner)
