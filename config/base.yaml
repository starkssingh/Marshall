# Base configuration shared by every profile. Profiles override keys from this file; environment
# variables (XQ_SECTION__KEY) and CLI overrides (--set section.key=value) override both.
# Secrets are never set here: use XQ_SECRETS__* environment variables.

project:
  name: xq

paths:
  root: .
  data_dir: data
  reports_dir: reports
  logs_dir: logs
  migrations_dir: migrations
  research_log: docs/research/log.md   # EXP-005: an entry is appended when an experiment closes

database:
  url: null            # null = SQLite at <data_dir>/metadata.sqlite (research tier)

logging:
  level: INFO
  console: true
  console_format: json
  file: logs/xq.jsonl
  # Libraries held at WARNING whatever the level, so CLI output is not flooded with their debug
  # lines (matplotlib's findfont, PIL's plugin imports) (ADR 0062).
  third_party: [matplotlib, PIL, fontTools]
  third_party_level: WARNING

vault:
  # Untouchable holdout: the most recent 12 months at project start (2026-09-26) plus all later
  # data. This instant is the start of trading day 2025-09-26 (17:00 America/New_York on
  # 2025-09-25, EDT). Changing it requires an ADR.
  start: "2025-09-25T21:00:00Z"

data:
  # The primary research feed (ADR 0057, superseding ADR 0004's choice): pipeline commands read it
  # when no --source is given, and the base dataset spec names it.
  primary_source: dukascopy

sources:
  # Changing `clock` for a source that already has ingested files is refused: declare a new source
  # id instead.
  #
  # Primary: Dukascopy XAUUSD bid/ask ticks (DATA-013, ADR 0057), UTC timestamps, tick history
  # from 2003-05-05. Reads the native hourly files `xq fetch dukascopy` downloads
  # (<SYMBOL>_<YYYY-MM-DD>_<HH>h_ticks.bi5) and dukascopy-node tick CSVs.
  dukascopy:
    adapter: dukascopy_ticks
    vendor: "Dukascopy Bank SA"
    feed_type: vendor_ticks
    venue: dukascopy
    price_type: bid_ask_ticks
    clock: "UTC"
    instrument: xauusd
    file_patterns: ["*.bi5", "*.csv"]
    vendor_symbol: XAUUSD
    point_scale: 1000      # integer points per USD in .bi5 records (2034155 = 2034.155)
    download:              # `xq fetch dukascopy`, run on a machine with internet access
      base_url: "https://datafeed.dukascopy.com/datafeed"
      history_start: "2003-05-05"   # first XAUUSD tick hour at the vendor (00:01 UTC)
      min_interval_s: 0.5           # at most two requests a second, one at a time
      timeout_s: 30
      max_attempts: 4               # then the run stops; rerunning resumes
      backoff_s: 2.0                # 2 s, 4 s, 8 s between attempts
      empty_retry_pause_s: 5.0      # an empty in-market hour is asked again once
      max_empty_open_hours: 24      # consecutive empty in-market hours that stop the run
  # Optional: an MT5 broker's tick export (ADR 0004). No execution venue is chosen (ADR 0057); if
  # one is, confirm vendor, venue and clock before ingesting its data.
  mt5_primary:
    adapter: mt5_ticks
    vendor: "MT5 broker (to be named)"
    feed_type: broker_ticks
    venue: tbd
    price_type: bid_ask_ticks
    clock: "NY+7"          # server time UTC+2 / UTC+3, switching on US DST dates
    instrument: xauusd
    file_patterns: ["*.csv", "*.txt"]

cleaning:
  # Non-destructive tick cleaning (DATA-007, ADR 0006). Every rule sets a flag bit; the rules
  # version written to data/clean/.../rules=<version>/ is this label plus a hash of the parameters
  # below and of the cleaning code version, so changing any of them creates a new clean store.
  version: c1
  drop: []                   # only DUP_EXACT, NONPOSITIVE, CROSSED may be listed
  log_flag_actions: true     # also log flags (drops are always logged) in cleaning_actions
  spread_outlier:
    window_ticks: 500
    min_periods: 50
    multiple: 10.0           # matches the DQ spread check (10x the hour-of-week median)
  spike:
    window_ticks: 500
    min_periods: 100
    z_threshold: 8.0         # matches the DQ spike check (reverting spikes above 8 robust sigma)
    reversal_ticks: 5
    reversal_fraction: 0.5
    min_scale_bps: 0.05      # floor on the robust return scale in quiet markets
  stale:
    seconds: 120             # matches the DQ stale-quote limit

bars:
  # Bid/ask/mid bars on 7 timeframes (DATA-008, ADR 0007). The build version in
  # data/bars/.../build=<version>/ is this label plus a hash of these settings, the bar code
  # version and the clean rules version.
  version: b1
  publication_latency_ms: 0   # available_at = bar end + this delay
  # Ticks carrying any of these flags do not enter bar prices (they are counted in n_excluded).
  # Only causal flags are allowed; SPIKE is refused because it is confirmed by later ticks.
  exclude_flags: [MISSING_QUOTE, NONPOSITIVE, CROSSED, DUP_EXACT]

datasets:
  # Diagnostic only (ADR 0026): target builds count the labels whose later fill came more than this
  # many seconds after its intended time. The allowed delay itself is a target-set parameter.
  fill_delay_report_s: 5

backtest:
  # Vectorized screener and cost model (BT-001, BT-002, ADR 0029). Positions are exposures relative
  # to `capital_usd`; daily returns are P&L over that capital. The cost model is PROVISIONAL until
  # the broker is named.
  cost_model: placeholder      # config/costs/placeholder.yaml
  risk_profile: default        # config/risk/default.yaml (the event tier's RiskEngine, Phase 14)
  capital_usd: 100000
  periods_per_year: 252        # annualization of daily (trading-day) statistics
  event:
    # Event-driven backtester (BT-004 ... BT-010, ADR 0049), tested on synthetic data only until
    # real data exists (ADR 0048). Its risk approver is a PLACEHOLDER until RISK-005 (Sprint 12).
    margin_rate: 0.05            # PROVISIONAL: used margin = notional x rate (1:20, retail gold CFD)
    blackouts:                   # BT-008: no order opening or increasing exposure fills inside these
      event_windows:             # windows of config/sessions.yaml
        - rollover               # 16:45-18:15 New York, the Sunday reopen included (C-3, ADR 0026)
        - us_data_release        # US releases -5/+30 min
      before_weekly_close_min: 60   # the last hour before a close followed by a day or more without trading
    flat_before_weekend: false   # optional: close every position before the weekly close ...
    flat_before_weekend_min: 30  # ... this many minutes before it (16:30 New York, before the rollover window)
    reconcile_tolerance: 0.05    # BT-009: equity difference between the tiers below 5 % of total costs

experiments:
  # Effective number of independent trials (EXP-004, ADR 0023, ADR 0026): trial returns are summed
  # per trading day, clustered by their correlation (average linkage on 1 - rho), and every
  # cluster counts once. Trials whose daily returns correlate above the threshold on average count
  # as one; pairs with fewer than `min_common_days` common trading days are treated as
  # independent. Fixed before any research result.
  trial_clustering:
    correlation_threshold: 0.7
    min_common_days: 60
