# Trading calendar, sessions and event anchors (DATA-002). Local times are quoted "HH:MM" strings
# in the stated IANA time zone and are converted to UTC per date, so DST is handled by construction.
# Market hours are confirmed on real Dukascopy ticks, 2014-2025 (DQ-008 review section 4); the
# holiday rules are the owner's decisions C1-C8 on that review (ADR 0070, amending ADR 0002).

# Calendar version (ADR 0070). Any change to `market` or `holidays` needs a new version, and every
# feature set computed on the calendar a new version too (ADR 0067 (5)). s1: ADR 0002's defaults
# (13:30 early closes, 12-24 and 12-31), retired before any build on real data. s2: C-35.
version: s2

market:                  # C1: confirmed on 3,028 days and 595 weekends, both DST regimes
  tz: America/New_York
  open: "18:00"          # quotes resume after the 17:00-18:00 daily break (on the previous day)
  close: "17:00"         # daily close; the trading day rolls at 17:00 New York
  week_open: "18:00"     # Sunday open of the Monday trading day
  trading_weekdays: [mon, tue, wed, thu, fri]

holidays:
  us_calendar: NYSE      # `holidays` package financial calendar, observed dates included
  uk_country: GB
  uk_subdiv: ENG         # English bank holidays: no LBMA auctions
  closed:                # C2: no trading at all (prefix match on the name; zero ticks, 34 dates)
    - New Year's Day
    - Good Friday
    - Christmas Day
  full_days:             # C7: named exceptions, traded in full (2018-12-05 and 2025-01-09)
    - National Day of Mourning
  early_close_time:      # C3: every other US-calendar holiday trades until this New York time
    - time: "13:00"                    # through 2021-12-31
    - {since: "2022-01-01", time: "14:30"}
  early_close_dates:     # fixed dates closing early (C4: 12-31 is a full day; C5: 12-24 at 13:45)
    "12-24": "13:45"
  early_close_after:     # C6: the day after this holiday closes early (prefix match on the name)
    Thanksgiving Day: "13:45"
  # C8: the irregular closes (2019-07-04, 2019-09-02, 2024-07-04, MLK Day 2014 and 2017) are left
  # unmodelled; the calendar checks keep flagging them.

sessions:
  tokyo:
    tz: Asia/Tokyo
    open: "09:00"
    close: "18:00"
  london:
    tz: Europe/London
    open: "08:00"
    close: "17:00"
  new_york:
    tz: America/New_York
    open: "08:00"
    close: "17:00"

overlaps:
  london_new_york: [london, new_york]

event_anchors:
  lbma_am:
    tz: Europe/London
    time: "10:30"
    skip_on: [uk_holiday]
  lbma_pm:
    tz: Europe/London
    time: "15:00"
    skip_on: [uk_holiday]
    skip_dates: ["12-24", "12-31"]   # LBMA holds only the morning auction on these days
  comex_open:
    tz: America/New_York
    time: "08:20"
    skip_on: [us_holiday]
  us_data_release:
    tz: America/New_York
    time: "08:30"
    skip_on: [us_holiday]
  rollover:
    tz: America/New_York
    time: "17:00"
    require_open: false    # financing rolls at 17:00 even after an early close

# Dataset calendar columns (DS-007): in_<name>_window. A window with `before_min` / `after_min` is
# true from that many minutes before the event anchor of the same name until `after_min` minutes
# after it; a window with `tz` / `start` / `end` is true for local clock times in [start, end) on
# every day. Both are half-open. Fixed before any research result; changes require an ADR.
event_windows:
  us_data_release:
    before_min: 5
    after_min: 30
  rollover:
    # The pre-close, the daily break and the reopen spread spike, Sunday reopen included (ADR 0026).
    tz: America/New_York
    start: "16:45"
    end: "18:15"
