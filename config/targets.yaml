# Versioned target sets (TGT-001, ADR 0024). The first dataset built with a version locks its
# definition (target_sets table); to change a definition, add a new version.

fwd_returns:
  v1:
    kind: forward_return      # TGT-002: execution-aware forward log returns (ADR 0025)
    # The plan's default horizons. EDA-006 (Sprint 5) decides which are admitted. Horizons and the
    # latency are trading time (ADR 0026): only market-open time counts, so a label from a Friday
    # or just before the close holds over the gap (crosses_close = true). 1d = one trading day = 23
    # market hours (ADR 0032); 4h = 4 market hours.
    horizons: [15m, 1h, 4h, 1d]
    price_refs: [long, short, mid]
    params:
      execution_latency_ms: 1000   # decision to order arrival; provisional until BT-001 / paper data
      max_fill_delay_s: 300        # no quote within 5 minutes of the intended fill time: no label
      sigma_span_bars: 96          # EWMA span of the interim sigma-hat (VOL-006 replaces it)
      vol_normalized: true         # also emit <name>_vol = return / (sigma-hat * sqrt(horizon))

realized_vol:
  v1:
    kind: realized_vol        # TGT-003: realized volatility of the mid over each label window
    # The forward returns' windows (entry and exit fills after the latency, market time), sampled
    # every 5 market minutes; a window crossing a close includes the overnight return (ADR 0063).
    horizons: [15m, 1h, 4h, 1d]
    price_refs: [mid]
    params:
      execution_latency_ms: 1000   # as fwd_returns.v1
      max_fill_delay_s: 300
      sigma_span_bars: 96          # interim sigma-hat, as fwd_returns.v1 (VOL-006 replaces it)
      sample_minutes: 5            # grid of market time from the intended entry
      vol_normalized: true         # also emit <name>_vol = realized / (sigma-hat * sqrt(horizon))

excursions:
  v1:
    kind: excursion           # TGT-004: maximum favourable / adverse excursion in sigma units
    # Every market-hours quote after the entry fill up to the exit fill, marked on the exit side
    # (long: bid against the entry ask; short: ask against the entry bid), divided by the interim
    # sigma-hat over the horizon (ADR 0063).
    horizons: [15m, 1h, 4h, 1d]
    price_refs: [long, short]
    params:
      execution_latency_ms: 1000   # as fwd_returns.v1
      max_fill_delay_s: 300
      sigma_span_bars: 96
