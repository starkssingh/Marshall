# Alembic configuration for the metadata database (DATA-005).
# Normally migrations run through `xq db upgrade`, which uses the configured database. Running
# `uv run alembic ...` directly uses the database of profile $XQ_PROFILE (default dev), or
# `-x db_url=<url>` if given.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
